<!-- Main container with your gradient background -->
<div class="flex flex-col items-center bg-gradient-to-b from-white to-red-500">
    
    <!-- This container holds the executive board layout -->
    <div class="flex flex-col items-center gap-y-6 my-10 w-3/4">
        
        <!-- President Box (Standalone) -->
        <!-- This now calls openModal() when clicked, passing the 'president' object from your .ts file -->
        <div (click)="openModal(president)" class="flex w-full h-24 justify-center items-center bg-white shadow-md rounded-md text-2xl font-medium cursor-pointer hover:bg-gray-100 transition-colors">
            {{ president.position }}
        </div>
        
        <!-- Container for the three columns -->
        <div class="flex flex-col sm:flex-row gap-x-6 w-full">
            
            <!-- Column 1 -->
            <div class="flex flex-col gap-y-6 flex-1 w-full">
                <!-- This *ngFor loop creates a box for each member in the 'column1' array from your .ts file -->
                <div *ngFor="let member of column1" (click)="openModal(member)" class="flex justify-center items-center w-full h-24 bg-white shadow-md rounded-md text-2xl font-medium text-center p-2 cursor-pointer hover:bg-gray-100 transition-colors">
                    {{ member.position }}
                </div>
            </div>
            
            <!-- Column 2 -->
            <div class="flex flex-col gap-y-6 flex-1 w-full mt-6 sm:mt-0">
                <!-- This loop creates boxes for column 2 -->
                <div *ngFor="let member of column2" (click)="openModal(member)" class="flex justify-center items-center w-full h-24 bg-white shadow-md rounded-md text-2xl font-medium text-center p-2 cursor-pointer hover:bg-gray-100 transition-colors">
                    {{ member.position }}
                </div>
            </div>

            <!-- Column 3 -->
            <div class="flex flex-col gap-y-6 flex-1 w-full mt-6 sm:mt-0">
                <!-- This loop creates boxes for column 3 -->
                <div *ngFor="let member of column3" (click)="openModal(member)" class="flex justify-center items-center w-full h-24 bg-white shadow-md rounded-md text-2xl font-medium text-center p-2 cursor-pointer hover:bg-gray-100 transition-colors">
                    {{ member.position }}
                </div>
            </div>

        </div>
    </div>

    <!-- Your original footer sections (I've left them as they were) -->
    <div class="bg-red-500 py-8 text-white w-screen">
        <!-- ... your footer content ... -->
    </div>
 
    <div class="bg-gray-800 text-white py-12 w-screen">
        <!-- ... your footer content ... -->
    </div>
</div>


<!-- MODAL CODE: This is hidden until 'isModalVisible' is true -->
<div *ngIf="isModalVisible" (click)="closeModal()" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 p-4">
    
    <!-- (click)="$event.stopPropagation()" prevents the modal from closing when you click inside the white box -->
    <div *ngIf="selectedExec" (click)="$event.stopPropagation()" class="bg-white rounded-lg shadow-xl p-6 sm:p-8 m-4 max-w-lg w-full z-50">
        
        <!-- Modal Header -->
        <div class="flex justify-between items-center border-b pb-3">
            <h3 class="text-xl sm:text-2xl font-bold text-gray-900">{{ selectedExec.position }}</h3>
            <button (click)="closeModal()" class="text-gray-500 hover:text-gray-800 text-3xl leading-none">&times;</button>
        </div>
        
        <!-- Modal Body -->
        <div class="mt-4">
            <p class="text-base sm:text-lg"><strong class="font-semibold">Name:</strong> <span>{{ selectedExec.name }}</span></p>
            <p class="text-base sm:text-lg mt-2"><strong class="font-semibold">Major:</strong> <span>{{ selectedExec.major }}</span></p>
            <p class="text-base sm:text-lg mt-2"><strong class="font-semibold">Email:</strong> <a href="mailto:{{ selectedExec.email }}" class="text-blue-600 hover:underline">{{ selectedExec.email }}</a></p>
            <div class="text-sm sm:text-base mt-4 bg-gray-50 p-3 sm:p-4 rounded-md max-h-48 overflow-y-auto border">
                <strong class="font-semibold block mb-2 text-gray-800">Bio:</strong>
                <p class="text-gray-700">{{ selectedExec.bio }}</p>
            </div>
        </div>
        
        <!-- Modal Footer -->
        <div class="mt-6 text-right">
            <button (click)="closeModal()" class="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">Close</button>
        </div>
    </div>
</div>
